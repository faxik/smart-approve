[project]
name = "smart-approve"
version = "0.1.0"
description = "Rule-first, AST-aware, Haiku-fallback PreToolUse hook for Claude Code."
requires-python = ">=3.11"
dependencies = [
    "bashlex>=0.18",
    "pyyaml>=6.0",
    "anthropic>=0.39",
]

[project.scripts]
smart-approve = "smart_approve.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --no-header"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smart_approve"]
