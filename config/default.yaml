# smart-approve default ruleset.
# First matching rule wins per leaf. Deny always beats allow at aggregation time.
# Unmatched leaves → classifier fallback.

log:
  path: ~/.claude/smart-approve/decisions.jsonl
  rotate_mb: 10
  keep: 5

rules:
  # Rewrites — normalize common prefixes so later rules match more commands.
  - name: git-dash-C
    match: '^git\s+-C\s+\S+\s+(.*)$'
    decision: rewrite
    rewrite_to: 'git \1'

  # Strip `timeout [flags] N[smhd] ...` wrapper so the inner command gets
  # evaluated normally. Rewrite loop caps at depth 3 in the engine.
  - name: timeout-prefix
    match: '^timeout\s+(?:-\S+\s+)*\d+[smhd]?\s+(.*)$'
    decision: rewrite
    rewrite_to: '\1'

  # Strip `nohup ...` wrapper.
  - name: nohup-prefix
    match: '^nohup\s+(.*)$'
    decision: rewrite
    rewrite_to: '\1'

  # Strip `setsid [-f] ...` wrapper (detached worktree-finish runs). Note the
  # rewrite depth cap is 3: setsid → nohup → final rule still fits.
  - name: setsid-prefix
    match: '^setsid\s+(?:-\S+\s+)*(.*)$'
    decision: rewrite
    rewrite_to: '\1'

  # Strip one or more `VAR=value ` env-var assignment prefixes in a single
  # rewrite so multi-var inputs don't burn through the depth-3 rewrite cap.
  - name: env-var-prefix
    match: '^(?:[A-Z_][A-Z0-9_]*=\S*\s+)+(.*)$'
    decision: rewrite
    rewrite_to: '\1'

  # Strip an `env VAR=val …` command prefix the same way (the `env` binary
  # form of the assignment prefix above). Same UPPERCASE-only name class as
  # that rule on purpose: a rewrite re-matches the remainder against every
  # rule, so a wider class here would silently promote `path=/x cat /etc/x`
  # from a classifier call to an `fs-read` allow. Widen both together or
  # neither.
  - name: env-cmd-prefix
    match: '^env\s+(?:[A-Z_][A-Z0-9_]*=\S*\s+)+(.*)$'
    decision: rewrite
    rewrite_to: '\1'

  # Read-only inspection (filesystem + system info + process state).
  # `cat`, `diff`, `cmp` promoted from classifier — high-frequency safe reads.
  # `ps`, `pgrep` are read-only (NOT `pkill`/`kill` which mutate).
  # `nvidia-smi`, `sleep`, `lscpu`, `lsblk` are harmless inspection.
  # `test`/`[` are POSIX file-test builtins — pure predicates, no side effects.
  - name: fs-read
    match: '^(ls|pwd|tree|find|stat|file|du|df|wc|which|type|whereis|head|tail|readlink|realpath|basename|dirname|uptime|id|groups|free|nproc|arch|cat|diff|cmp|ps|pgrep|nvidia-smi|sleep|lscpu|lsblk|lspci|lsusb|xxd|od|md5sum|sha1sum|sha256sum|test)(\s|$)'
    decision: allow

  - name: search
    match: '^(grep|rg|fd|ack|ag)(\s|$)'
    decision: allow

  # Text-processing pipe helpers — all read stdin / write stdout.
  - name: pipe-helpers
    match: '^(sort|uniq|cut|tr|column|nl|rev|fold|paste|join|comm)(\s|$)'
    decision: allow

  # `sed -n` is print-only (no `-i` in-place edit). Common for file-window
  # reads: `sed -n '100,150p' path`. Writes via `-i` stay in the classifier.
  - name: sed-read
    match: '^sed\s+-n(\s|$)'
    decision: allow

  # `awk` / `gawk` without `-i inplace` is a pure read filter. The rare
  # `gawk -i inplace` form falls through to the classifier via normal
  # escalation rather than matching here.
  - name: awk-read
    match: '^(g?awk)(\s|$)'
    decision: allow

  - name: cd
    match: '^cd(\s|$)'
    decision: allow

  - name: mkdir-p
    match: '^mkdir\s+-p(\s|$)'
    decision: allow

  - name: echo-printf
    match: '^(echo|printf|date|uname|whoami|hostname)(\s|$)'
    decision: allow

  - name: env-read
    match: '^env$'
    decision: allow

  # Shell no-op/probe builtins. `true` alone was classifier-asked 28 times in
  # one week of the decision log.
  - name: shell-noop
    match: '^(true|false|:)(\s|$)'
    decision: allow

  - name: command-v
    match: '^command\s+-v(\s|$)'
    decision: allow

  # Git read
  - name: git-read
    match: '^git\s+(status|log|diff|show|branch|remote|blame|ls-files|ls-tree|rev-parse|worktree|describe|shortlog|reflog|tag|cat-file|merge-base|config\s+--get|stash\s+list)(\s|$)'
    decision: allow

  # Git safe writes.
  # `merge` included — merge --no-ff/--ff-only is routine; dangerous cases
  # (--abort, conflict resolution) remain safe because the workdir is already
  # version-controlled.
  # `clone` and `config` added 2026-08-19: sandbox scaffolds (git init +
  # git config user.email + git clone of a local fixture repo) were the
  # second-largest ask source in the 2026-08-17 bugfix-loop stall analysis,
  # and the user's own settings already allow `git:*` wholesale.
  - name: git-write-safe
    match: '^git\s+(add|commit|stash|fetch|pull\s+--ff-only|checkout|switch|restore|mv|rm\s+--cached|init|merge|cherry-pick|revert|clone|config)(\s|$)'
    decision: allow

  # Git destructive — deny
  - name: git-push-force
    match: '^git\s+push\s+--force'
    decision: deny
    reason: "force push — ask explicitly"

  - name: git-reset-hard
    match: '^git\s+reset\s+--hard'
    decision: deny
    reason: "reset --hard discards work — ask explicitly"

  - name: git-clean-force
    match: '^git\s+clean\s+-[a-zA-Z]*f'
    decision: deny
    reason: "clean -f deletes untracked files — ask explicitly"

  # uv — the project runner. `uv run` executes project code at the same trust
  # level as pytest (allowed below); pip/venv/sync/lock manage the project env.
  # This was the single biggest classifier-traffic source measured on
  # 2026-08-17: 368 classifier calls, ~1.6s median each, mostly `uv run` shapes.
  - name: uv-run
    match: '^uv\s+run(\s|$)'
    decision: allow

  - name: uv-env
    match: '^uv\s+(pip|venv|sync|lock)(\s|$)'
    decision: allow

  # Claude Code session scratchpads (/tmp/claude-<uid>/…) are disposable repro
  # sandboxes; the bugfix-loop idiom scaffolds and tears down throwaway repos
  # there constantly. rm/cp/bash are allowed only when EVERY path argument is
  # inside a scratchpad; one argument outside (or any `..` traversal) drops the
  # whole leaf back to the classifier. Relative-path forms after `cd` into a
  # scratchpad cannot be verified from the leaf text and stay with the
  # classifier (steered by the sandbox hint below).
  #
  # The path list is written as `item (\s+ item)*` rather than `(item \s*)+`.
  # The latter is ambiguous — `\S+` and a possibly-empty `\s*` give one glued
  # token exponentially many split points, and matching backtracks
  # catastrophically: measured 0.3ms / 18ms / 257ms / 868ms at 10 / 16 / 20 /
  # 22 repeated path segments, i.e. past the hook's 5s budget shortly after.
  # A single `rm` line was enough to stall the hook into `hook_cancelled`.
  # Requiring a NON-empty separator between items makes the split unique.
  - name: scratchpad-rm
    match: '^(?!.*\.\.)rm\s+(?:-[a-zA-Z]+\s+)*/tmp/claude-\d+/\S+(?:\s+/tmp/claude-\d+/\S+)*\s*$'
    decision: allow

  - name: scratchpad-cp
    match: '^(?!.*\.\.)cp\s+(?:-[a-zA-Z]+\s+)*(?:\S+\s+)+/tmp/claude-\d+/\S+$'
    decision: allow

  - name: scratchpad-bash
    match: '^(?!.*\.\.)bash\s+(?:-[ex]+\s+)*/tmp/claude-\d+/\S+(\s|$)'
    decision: allow

  # Running a python script staged in a scratchpad — same trust level as
  # scratchpad-bash (the analysis/repro-script idiom).
  - name: scratchpad-python
    match: '^(?!.*\.\.)(\S*/)?python3?\s+/tmp/claude-\d+/\S+(\s|$)'
    decision: allow

  # User-authored Claude Code skill helper scripts (~/.claude/skills/**) —
  # e.g. the codex-code-review start/resume wrappers.
  - name: skill-scripts
    match: '^(?!.*\.\.)(bash\s+)?\S*/\.claude/skills/\S+\.(sh|py)(\s|$)'
    decision: allow

  # Cross-model review runs: codex CLI pinned to its read-only sandbox. The
  # non-read-only forms stay with the classifier.
  #
  # The flag must appear in FLAG position, not merely somewhere in the leaf:
  # `[^'"]*` cannot cross into the quoted prompt, so a prompt that happens to
  # mention `--sandbox read-only` no longer vouches for the run it is part of.
  # Measured before this anchor:
  #   codex exec --sandbox danger-full-access 'fix X (--sandbox read-only …)'
  # was ALLOWED — full disk access granted with no prompt.
  - name: codex-exec-readonly
    match: '^codex\s+exec\s(?=[^''"]*--sandbox\s+read-only(\s|$))'
    decision: allow

  # `kill -0 PID` is a pure existence probe — sends no signal. Real signals
  # stay with the classifier.
  - name: kill-probe
    match: '^kill\s+-0\s+\d+(\s+\d+)*$'
    decision: allow

  # Test / lint / typecheck runners. `(\S*/)?` allows bare tool,
  # .venv-local paths, or absolute paths like /home/u/proj/.venv/bin/python.
  - name: pytest
    match: '^(\S*/)?python3?\s+-m\s+pytest(\s|$)'
    decision: allow

  - name: pytest-bare
    match: '^(\S*/)?pytest(\s|$)'
    decision: allow

  - name: mypy
    match: '^(\S*/)?python3?\s+-m\s+mypy(\s|$)'
    decision: allow

  # Bare `mypy` or any `path/to/.venv/bin/mypy` invocation. Path-tolerant so
  # absolute-venv compound chains (`/abs/.venv/bin/mypy --strict ...`) match
  # without escalating the whole chain to the classifier.
  - name: mypy-bare
    match: '^(\S*/)?mypy(\s|$)'
    decision: allow

  - name: ruff
    match: '^(\S*/)?(python3?\s+-m\s+)?ruff\s+(check|format\s+--check)(\s|$)'
    decision: allow

  - name: tsc
    match: '^(\S*/)?tsc\s+--noEmit(\s|$)'
    decision: allow

  - name: npm-safe
    match: '^npm\s+(test|run\s+(lint|test|typecheck|check|build))(\s|$)'
    decision: allow

  - name: cargo-safe
    match: '^cargo\s+(check|test|clippy)(\s|$)'
    decision: allow

  - name: go-safe
    match: '^go\s+(test|vet|build)(\s|$)'
    decision: allow

  # Tooling
  - name: jq-yq
    match: '^(jq|yq)(\s|$)'
    decision: allow

  # sqlite3 read-only: queries starting with SELECT/PRAGMA, or .schema/.tables/
  # .databases/.indexes/.headers/.dump dot-commands. Writes (INSERT/UPDATE/
  # DELETE/DROP/ALTER/CREATE/REPLACE/ATTACH) stay in the classifier.
  # Case-insensitive via inline (?i).
  - name: sqlite3-read
    match: '(?i)^sqlite3(\s+-\S+)*\s+\S+\s+[''"]\s*(SELECT|PRAGMA|WITH|EXPLAIN|\.schema|\.tables|\.databases|\.indexes|\.headers|\.dump|\.show|\.help)\b'
    decision: allow

  - name: python-dash-c
    match: '^(\S*/)?python3?\s+-c\s'
    decision: allow

  - name: python-version
    match: '^(\S*/)?(python3?|node|npm)\s+--version$'
    decision: allow

  # GitHub CLI — read-only subcommands only. Writes (repo create, pr create,
  # issue close, etc.) stay in the classifier.
  - name: gh-read
    match: '^gh\s+(auth\s+status|repo\s+view|pr\s+(view|list|diff|checks|status)|issue\s+(view|list)|browse|label\s+list|run\s+(list|view))(\s|$)'
    decision: allow

  # Project-local helpers (autosorter)
  # `tools/` anchor retained so the rule still identifies a repo helper, not
  # an arbitrary script sharing the name. `(\S*/)?` lets absolute paths
  # (e.g. `/home/u/proj/tools/worktree-setup.sh`) match too.
  - name: worktree-scripts
    match: '^(\S*/)?tools/(worktree-setup|worktree-finish|pre-finish-checks)\.(sh|py)(\s|$)'
    decision: allow

  # smart-approve's own read-only CLI. `explain` and `stats` only READ the
  # decision log; `prune` REWRITES it and is deliberately excluded, so it
  # keeps needing a decision. Added because `explain` — the command an
  # operator runs to diagnose a prompt — was itself being asked (measured:
  # 1448 ms classifier round-trip, verdict `ask`), i.e. the diagnostic tool
  # generated the friction it exists to explain. `explain` never executes its
  # argument, it only parses it, so a dangerous-looking argument is data.
  - name: smart-approve-read
    match: '^(\S*/)?smart-approve\s+(explain|stats)(\s|$)'
    decision: allow

  - name: smart-approve-read-module
    match: '^(\S*/)?python3?\s+-m\s+smart_approve\s+(explain|stats)(\s|$)'
    decision: allow

  - name: chmod-plus-x
    match: '^chmod\s+\+x(\s|$)'
    decision: allow

  # Hard deny list
  - name: rm-rf-root
    match: '^rm\s+-[a-zA-Z]*[rf]\s+/(\s|$)'
    decision: deny
    reason: "rm -rf / → absolutely not"

  - name: sudo
    match: '^sudo(\s|$)'
    decision: deny
    reason: "sudo requires explicit user authorization"

  - name: shutdown
    match: '^(shutdown|reboot|poweroff|halt)(\s|$)'
    decision: deny
    reason: "host-level control — not a dev operation"

  - name: curl-pipe-sh
    match: '(curl|wget).*\|\s*(sh|bash|zsh)(\s|$)'
    decision: deny
    reason: "curl | sh from network — ask explicitly"

hints:
  - decision: allow
    text: "git commit with multi-line messages via heredoc $(cat <<'EOF'...EOF) — this is how Claude Code formats commit messages"
  - decision: allow
    text: "sed, awk, head, tail with pipes for text inspection — read-only output processing"
  - decision: allow
    text: "find with xargs grep for code search — read-only pattern matching"
  - decision: allow
    text: "compound sandbox scaffolds that cd into /tmp/claude-<uid>/… and then mkdir/cp/rm/chmod/git-init/run scripts THERE — session scratchpads are disposable repro sandboxes; relative paths after the cd are inside it"
  - decision: allow
    text: "running a repo's own CLI or helper scripts inside its checkout or worktree — python -m <pkg>.cli, .venv/bin/python -m <pkg>, tools/*.sh"
  - decision: allow
    text: "sourcing a repo's tools/_guards.sh (or similar test-harness library) to probe a guard function read-only"

ast_escalate:
  - command_substitution
  - process_substitution
  - heredoc
  - eval
  - source_or_dot
  - coproc

classifier:
  enabled: true
  model: claude-haiku-4-5-20251001
  timeout_s: 3.0
  # Total across all attempts, must stay under the hook's own 5s timeout —
  # the per-attempt timeout is derived from this, so retries can't overrun it.
  budget_s: 4.5
  system_prompt_file: prompts/classify.md
  # Auth resolution — first hit wins:
  #   1. oauth_token_env — read OAuth bearer from the named env var
  #   2. oauth_token_file — read OAuth bearer from file
  #                         (raw token, or ~/.claude/.credentials.json shape)
  #   3. CLAUDE_CODE_OAUTH_TOKEN env (auto-set by the `claude` CLI for child processes)
  #   4. ANTHROPIC_AUTH_TOKEN env (SDK's documented OAuth env var)
  #   5. ANTHROPIC_API_KEY env
  # Leave all commented to rely on whatever's already in the environment
  # (ANTHROPIC_API_KEY keeps working out of the box).
  # oauth_token_env: CLAUDE_CODE_OAUTH_TOKEN
  # oauth_token_file: ~/.claude/.credentials.json

defaults:
  on_classifier_error: ask
  # "classify" = route unparseable commands (e.g. bashlex choking on quoted
  # heredoc tags like <<'EOF') to the Haiku classifier rather than falling
  # through to a user prompt. Use "ask" to restore the old behavior.
  on_parse_error: classify
  on_hook_error: ask
